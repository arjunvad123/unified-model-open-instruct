# Baseline Generation Benchmark: Our Model (3B) vs Top 5 Generation Models
# Framework: lm-evaluation-harness (ARC, HellaSwag, Winogrande, MMLU)
#
# Models:
#   1. Ours: Arjunvad/unified-model-stage1-action-tokens-v2 (3B)
#   2. HuggingFaceTB/SmolLM2-1.7B (1.7B)
#   3. google/gemma-2-2b (2B)
#   4. Qwen/Qwen2.5-7B (7.6B)
#   5. mistralai/Mistral-7B-v0.1 (7B)
#   6. meta-llama/Llama-3.1-8B (8B)
#
# Deploy: kubectl apply -f baseline-generation-lmeval.yaml -n svcl-self-improve
# Logs:   kubectl logs job/baseline-gen-lmeval -n svcl-self-improve -f

apiVersion: batch/v1
kind: Job
metadata:
  name: baseline-gen-lmeval
  namespace: svcl-self-improve
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-L40S
                - NVIDIA-L40

      containers:
        - name: eval
          image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              echo "==========================================================="
              echo "Baseline Generation Benchmark (lm-evaluation-harness)"
              echo "Our Model (3B) vs Top 5 Generation Models"
              echo "==========================================================="
              nvidia-smi --query-gpu=index,name,memory.total --format=csv

              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends \
                curl ca-certificates python3 python3-pip python3-venv git

              python3 -m venv /opt/venv
              source /opt/venv/bin/activate

              pip install --upgrade pip
              pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
              pip install "transformers>=4.51.0" accelerate lm-eval numpy

              python -c "import torch; print(f'PyTorch {torch.__version__}, CUDA: {torch.cuda.is_available()}')"
              python -c "import lm_eval; print(f'lm-eval version: {lm_eval.__version__}')"

              mkdir -p /workspace/results
              cd /workspace

              cat > run_baseline_gen.py << 'PYTHON_SCRIPT'
              import json, os, subprocess, sys
              from datetime import datetime

              MODELS = [
                  ("Ours (3B)",           "Arjunvad/unified-model-stage1-action-tokens-v2", "ours"),
                  ("SmolLM2-1.7B",        "HuggingFaceTB/SmolLM2-1.7B",                    "smollm2"),
                  ("Gemma-2-2B",          "google/gemma-2-2b",                              "gemma2"),
                  ("Qwen2.5-7B",          "Qwen/Qwen2.5-7B",                               "qwen25"),
                  ("Mistral-7B-v0.1",     "mistralai/Mistral-7B-v0.1",                      "mistral7b"),
                  ("Phi-2 (2.7B)",        "microsoft/phi-2",                                "phi2"),
              ]

              CORE_TASKS = "arc_easy,arc_challenge,hellaswag,winogrande"
              RESULTS_DIR = "/workspace/results"

              all_results = {}

              for display_name, model_id, key in MODELS:
                  print("\n" + "=" * 70)
                  print(f"EVALUATING: {display_name} ({model_id})")
                  print("=" * 70)

                  model_dir = os.path.join(RESULTS_DIR, key)
                  os.makedirs(model_dir, exist_ok=True)

                  # Run core tasks
                  print(f"\n  Running: {CORE_TASKS}")
                  cmd = [
                      sys.executable, "-m", "lm_eval",
                      "--model", "hf",
                      "--model_args", f"pretrained={model_id},trust_remote_code=True,dtype=bfloat16",
                      "--tasks", CORE_TASKS,
                      "--batch_size", "auto",
                      "--output_path", model_dir,
                  ]
                  result = subprocess.run(cmd, capture_output=False, text=True)
                  if result.returncode != 0:
                      print(f"  WARNING: Core tasks failed for {display_name}")

                  # Run MMLU separately
                  print(f"\n  Running: MMLU (5-shot)")
                  cmd_mmlu = [
                      sys.executable, "-m", "lm_eval",
                      "--model", "hf",
                      "--model_args", f"pretrained={model_id},trust_remote_code=True,dtype=bfloat16",
                      "--tasks", "mmlu",
                      "--num_fewshot", "5",
                      "--batch_size", "auto",
                      "--output_path", model_dir,
                  ]
                  result = subprocess.run(cmd_mmlu, capture_output=False, text=True)
                  if result.returncode != 0:
                      print(f"  WARNING: MMLU failed for {display_name}")

                  # Parse results (lm-eval saves as results_TIMESTAMP.json)
                  model_results = {}
                  for root, dirs, files in os.walk(model_dir):
                      for fname in sorted(files):
                          if fname.startswith("results") and fname.endswith(".json"):
                              fpath = os.path.join(root, fname)
                              print(f"  Found results file: {fpath}")
                              try:
                                  with open(fpath) as f:
                                      data = json.load(f)
                                  if "results" in data:
                                      for task_name, task_data in data["results"].items():
                                          model_results[task_name] = task_data
                              except Exception as e:
                                  print(f"  Error parsing {fpath}: {e}")

                  all_results[key] = {"display_name": display_name, "model_id": model_id, "tasks": model_results}
                  print(f"\n  Parsed {len(model_results)} task results for {display_name}")

              # ============================================================
              # Print comparison table
              # ============================================================
              print("\n" + "=" * 120)
              print("GENERATION BASELINE BENCHMARK RESULTS")
              print("=" * 120)

              task_display = [
                  ("arc_easy", "acc_norm", "ARC-Easy"),
                  ("arc_challenge", "acc_norm", "ARC-Challenge"),
                  ("hellaswag", "acc_norm", "HellaSwag"),
                  ("winogrande", "acc", "Winogrande"),
              ]

              keys = ["ours", "smollm2", "gemma2", "qwen25", "mistral7b", "phi2"]
              names = {"ours": "Ours(3B)", "smollm2": "SmolLM2", "gemma2": "Gemma2", "qwen25": "Qwen2.5", "mistral7b": "Mistral", "phi2": "Phi-2"}

              header = f"{'Task':<18}" + "".join(f"{names[k]:<14}" for k in keys)
              print(f"\n{header}")
              print("-" * len(header))

              avg_scores = {k: [] for k in keys}

              for task_key, metric, task_label in task_display:
                  row = f"{task_label:<18}"
                  for k in keys:
                      found = False
                      if k in all_results:
                          tasks = all_results[k].get("tasks", {})
                          for tname, tdata in tasks.items():
                              if task_key in tname.lower():
                                  val = tdata.get(metric, tdata.get("acc", None))
                                  if val is not None:
                                      row += f"{val:<14.4f}"
                                      avg_scores[k].append(val)
                                      found = True
                                      break
                      if not found:
                          row += f"{'N/A':<14}"
                  print(row)

              # MMLU row
              row = f"{'MMLU (5-shot)':<18}"
              for k in keys:
                  found = False
                  if k in all_results:
                      tasks = all_results[k].get("tasks", {})
                      for tname, tdata in tasks.items():
                          if "mmlu" == tname.lower().strip():
                              val = tdata.get("acc", tdata.get("acc_norm", None))
                              if val is not None:
                                  row += f"{val:<14.4f}"
                                  avg_scores[k].append(val)
                                  found = True
                                  break
                  if not found:
                      row += f"{'N/A':<14}"
              print(row)

              print("-" * len(header))
              row = f"{'AVERAGE':<18}"
              for k in keys:
                  vals = avg_scores[k]
                  if vals:
                      row += f"{sum(vals)/len(vals):<14.4f}"
                  else:
                      row += f"{'N/A':<14}"
              print(row)

              with open(os.path.join(RESULTS_DIR, "baseline_generation.json"), "w") as f:
                  json.dump({"timestamp": datetime.now().isoformat(), "models": all_results}, f, indent=2, default=str)
              print(f"\nSaved to {RESULTS_DIR}/baseline_generation.json")
              print("=" * 120)

              PYTHON_SCRIPT

              python run_baseline_gen.py

              echo "Done. Pod alive 30min for log inspection..."
              sleep 1800

          resources:
            requests:
              memory: "48Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "64Gi"
              cpu: "8"
              nvidia.com/gpu: "1"

          env:
            - name: HF_HOME
              value: "/tmp/hf_cache"
            - name: TRANSFORMERS_CACHE
              value: "/tmp/hf_cache"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
