apiVersion: batch/v1
kind: Job
metadata:
  name: eval-distilled-stage1-5-qwen3
  namespace: svcl-self-improve
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-SXM4-40GB
                      - NVIDIA-L40S
                      - NVIDIA-L40
                      - NVIDIA-A40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-6000-Ada-Generation
                      - NVIDIA-A10
                      - NVIDIA-A30
                      - NVIDIA-L4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: eval-distilled
          image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "==========================================================="
              echo "Evaluate distilled Stage 1.5 Qwen3 adapter on BEIR"
              echo "==========================================================="
              echo "Compares three cells under one dependency/runtime surface:"
              echo "1. Stage 1.5 v1 baseline: <ACT:RET> query prefix + mean pooling"
              echo "2. Local distilled LoRA adapter: <ACT:RET> query prefix + mean pooling"
              echo "3. Qwen3-Embedding-0.6B teacher: native query instruction + last-token pooling"
              date -u +"start_utc=%Y-%m-%dT%H:%M:%SZ"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv

              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends \
                curl ca-certificates python3 python3-pip python3-venv git

              python3 -m venv /opt/venv
              source /opt/venv/bin/activate

              pip install --upgrade pip
              pip install torch --index-url https://download.pytorch.org/whl/cu121
              pip install "transformers==4.51.3" accelerate peft mteb numpy

              mkdir -p /workspace/results
              cd /workspace

              ACT_RET_REPO_REF="${ACT_RET_REPO_REF:-main}"
              echo "Cloning open_instruct/action_tokens.py at ref=$ACT_RET_REPO_REF"
              if ! git clone --depth 1 --branch "$ACT_RET_REPO_REF" \
                     https://github.com/arjunvad123/unified-model-open-instruct.git \
                     /workspace/unified-model-open-instruct 2>/dev/null; then
                echo "  --branch failed (likely a SHA, not a branch/tag); using full clone + checkout"
                git clone https://github.com/arjunvad123/unified-model-open-instruct.git /workspace/unified-model-open-instruct
                ( cd /workspace/unified-model-open-instruct && git checkout "$ACT_RET_REPO_REF" )
              fi
              export ACT_RET_SOURCE_REF="$ACT_RET_REPO_REF"
              export ACT_RET_SOURCE_SHA=$(cd /workspace/unified-model-open-instruct && git rev-parse HEAD)
              echo "Resolved ACT_RET source: ref=$ACT_RET_SOURCE_REF sha=$ACT_RET_SOURCE_SHA"

              cat > run_distilled_eval.py << 'PYTHON_SCRIPT'
              import gc
              import json
              import math
              import os
              import sys
              from datetime import datetime, timezone

              sys.path.insert(0, "/workspace/unified-model-open-instruct")
              try:
                  from open_instruct.action_tokens import ACT_RET  # noqa: E402
              except ImportError:
                  from open_instruct.action_tokens import ACTION_TOKENS  # noqa: E402
                  ACT_RET = next(t for t in ACTION_TOKENS if t == "<ACT:RET>")

              import mteb
              import numpy as np
              import peft
              import torch
              import torch.nn.functional as F
              import transformers
              from peft import PeftModel
              from transformers import AutoModel, AutoModelForCausalLM, AutoTokenizer

              RESULTS_DIR = "/workspace/results"
              OUTPUT_PATH = os.path.join(RESULTS_DIR, "eval_matrix.json")
              DISTILLED_ADAPTER_PATH = "/workspace/distilled-adapter"

              TASKS = ["NFCorpus", "SciFact", "ArguAna", "SCIDOCS"]
              DTYPE = torch.bfloat16
              MAX_LENGTH = 512
              BATCH_SIZE = 16

              QWEN_QUERY_PREFIX = (
                  "Instruct: Given a web search query, retrieve relevant passages that answer the query\n"
                  "Query: "
              )
              MODELS = {
                  "stage1_5_v1_anchor": {
                      "kind": "causal_lm",
                      "model_id": "Arjunvad/unified-model-stage1-5",
                      "query_prefix": f"{ACT_RET} ",
                      "pooling": "mean",
                      "prior_avg_ndcg10": 0.3536,
                  },
                  "distilled_stage1_5_qwen3": {
                      "kind": "local_peft_lora",
                      "base_model_id": "Arjunvad/unified-model-stage1-5",
                      "adapter_path": DISTILLED_ADAPTER_PATH,
                      "query_prefix": f"{ACT_RET} ",
                      "pooling": "mean",
                  },
                  "qwen3_emb_0_6b_teacher_anchor": {
                      "kind": "embedding",
                      "model_id": "Qwen/Qwen3-Embedding-0.6B",
                      "query_prefix": QWEN_QUERY_PREFIX,
                      "pooling": "last_token",
                      "prior_avg_ndcg10": 0.4427,
                  },
              }

              def utc_now():
                  return datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

              def model_device(model):
                  return next(model.parameters()).device

              def load_model(model_key, model_config):
                  kind = model_config["kind"]
                  print(f"\nLoading {model_key} ({kind})", flush=True)

                  if kind == "local_peft_lora":
                      adapter_path = model_config["adapter_path"]
                      base_model_id = model_config["base_model_id"]
                      if not os.path.exists(os.path.join(adapter_path, "adapter_config.json")):
                          raise FileNotFoundError(f"Missing local adapter at {adapter_path}")
                      tokenizer = AutoTokenizer.from_pretrained(
                          adapter_path,
                          trust_remote_code=True,
                          token=os.environ.get("HF_TOKEN"),
                      )
                      base_model = AutoModelForCausalLM.from_pretrained(
                          base_model_id,
                          trust_remote_code=True,
                          torch_dtype=DTYPE,
                          device_map="auto",
                          token=os.environ.get("HF_TOKEN"),
                      )
                      model = PeftModel.from_pretrained(base_model, adapter_path)
                      print("  Merging local LoRA adapter for inference", flush=True)
                      model = model.merge_and_unload()
                  elif kind == "embedding":
                      model_id = model_config["model_id"]
                      tokenizer = AutoTokenizer.from_pretrained(
                          model_id,
                          trust_remote_code=True,
                          token=os.environ.get("HF_TOKEN"),
                      )
                      model = AutoModel.from_pretrained(
                          model_id,
                          trust_remote_code=True,
                          torch_dtype=DTYPE,
                          device_map="auto",
                          token=os.environ.get("HF_TOKEN"),
                      )
                  elif kind == "causal_lm":
                      model_id = model_config["model_id"]
                      tokenizer = AutoTokenizer.from_pretrained(
                          model_id,
                          trust_remote_code=True,
                          token=os.environ.get("HF_TOKEN"),
                      )
                      model = AutoModelForCausalLM.from_pretrained(
                          model_id,
                          trust_remote_code=True,
                          torch_dtype=DTYPE,
                          device_map="auto",
                          token=os.environ.get("HF_TOKEN"),
                      )
                  else:
                      raise ValueError(f"Unknown model kind: {kind}")

                  if tokenizer.pad_token is None:
                      tokenizer.pad_token = tokenizer.eos_token
                  model.eval()
                  return tokenizer, model

              def encode(model, tokenizer, texts, prefix, pooling, batch_size=BATCH_SIZE):
                  chunks = []
                  device = model_device(model)
                  for start in range(0, len(texts), batch_size):
                      raw_batch = texts[start:start + batch_size]
                      batch = [prefix + text for text in raw_batch]
                      inputs = tokenizer(
                          batch,
                          padding=True,
                          truncation=True,
                          max_length=MAX_LENGTH,
                          return_tensors="pt",
                      )
                      inputs = {key: value.to(device) for key, value in inputs.items()}
                      with torch.no_grad():
                          outputs = model(
                              **inputs,
                              output_hidden_states=True,
                              use_cache=False,
                              return_dict=True,
                          )
                          hidden = outputs.hidden_states[-1].float()
                          attention_mask = inputs["attention_mask"]
                          if pooling == "mean":
                              mask = attention_mask.unsqueeze(-1).float()
                              embeddings = (hidden * mask).sum(dim=1) / mask.sum(dim=1).clamp(min=1e-9)
                          elif pooling == "last_token":
                              seq_lens = attention_mask.sum(dim=1).clamp(min=1) - 1
                              embeddings = hidden[torch.arange(hidden.size(0), device=hidden.device), seq_lens]
                          else:
                              raise ValueError(f"Unknown pooling: {pooling}")
                          embeddings = F.normalize(embeddings, p=2, dim=1)
                          chunks.append(embeddings.cpu().numpy().astype(np.float32))
                  return np.concatenate(chunks, axis=0)

              def load_retrieval_task(task_name):
                  print(f"Loading MTEB task {task_name}", flush=True)
                  task = mteb.get_task(task_name)
                  task.load_data()

                  subsets = list(task.dataset.keys())
                  if not subsets:
                      raise RuntimeError(f"{task_name}: empty task.dataset")
                  subset = subsets[0]
                  splits = task.dataset[subset]

                  split = None
                  for candidate in ("test", "dev", "validation", "train"):
                      if candidate in splits:
                          split = candidate
                          break
                  if split is None:
                      split = sorted(splits.keys())[0]

                  split_data = splits[split]
                  corpus_ds = split_data["corpus"]
                  queries_ds = split_data["queries"]
                  qrels_raw = split_data["relevant_docs"]

                  corpus_ids = []
                  corpus_texts = []
                  for row in corpus_ds:
                      corpus_id = str(row["id"])
                      title = (row.get("title") or "").strip()
                      text = (row.get("text") or "").strip()
                      corpus_ids.append(corpus_id)
                      corpus_texts.append(f"{title} {text}".strip())

                  query_ids = []
                  query_texts = []
                  for row in queries_ds:
                      query_ids.append(str(row["id"]))
                      query_texts.append(row["text"])

                  qrels = {}
                  if isinstance(qrels_raw, dict):
                      for qid, docs in qrels_raw.items():
                          if isinstance(docs, dict):
                              qrels[str(qid)] = {str(d): float(s) for d, s in docs.items()}
                          else:
                              qrels[str(qid)] = {str(d): 1.0 for d in docs}
                  else:
                      for row in qrels_raw:
                          qid = row.get("query-id", row.get("query_id", row.get("qid")))
                          did = row.get("corpus-id", row.get("corpus_id", row.get("docid")))
                          score = float(row.get("score", 1))
                          if qid is not None and did is not None:
                              qrels.setdefault(str(qid), {})[str(did)] = score

                  return {
                      "subset": subset,
                      "split": split,
                      "corpus_ids": corpus_ids,
                      "corpus_texts": corpus_texts,
                      "query_ids": query_ids,
                      "query_texts": query_texts,
                      "qrels": qrels,
                  }

              def compute_metrics(query_emb, corpus_emb, query_ids, corpus_ids, qrels):
                  scores = np.matmul(query_emb, corpus_emb.T)
                  ndcg10_total = 0.0
                  hits1_total = 0.0
                  mrr_total = 0.0
                  evaluated = 0

                  for query_index, query_id in enumerate(query_ids):
                      rels_raw = qrels.get(query_id, {})
                      rel_scores = {}
                      for doc_id, rel in rels_raw.items():
                          try:
                              rel_value = float(rel)
                          except (TypeError, ValueError):
                              rel_value = 1.0
                          if rel_value > 0:
                              rel_scores[doc_id] = rel_value
                      if not rel_scores:
                          continue

                      evaluated += 1
                      ranked_idx = np.argsort(scores[query_index])[::-1]
                      ranked_doc_ids = [corpus_ids[idx] for idx in ranked_idx]

                      if ranked_doc_ids[0] in rel_scores:
                          hits1_total += 1.0

                      for rank, doc_id in enumerate(ranked_doc_ids, start=1):
                          if doc_id in rel_scores:
                              mrr_total += 1.0 / rank
                              break

                      dcg = 0.0
                      for rank, doc_id in enumerate(ranked_doc_ids[:10], start=1):
                          gain = rel_scores.get(doc_id, 0.0)
                          if gain > 0:
                              dcg += gain / math.log2(rank + 1)

                      ideal_gains = sorted(rel_scores.values(), reverse=True)[:10]
                      idcg = sum(gain / math.log2(rank + 1) for rank, gain in enumerate(ideal_gains, start=1))
                      if idcg > 0:
                          ndcg10_total += dcg / idcg

                  if evaluated == 0:
                      return {"ndcg10": 0.0, "hits1": 0.0, "mrr": 0.0, "evaluated_queries": 0}

                  return {
                      "ndcg10": ndcg10_total / evaluated,
                      "hits1": hits1_total / evaluated,
                      "mrr": mrr_total / evaluated,
                      "evaluated_queries": evaluated,
                  }

              def package_config():
                  return {
                      "job_name": os.environ["JOB_NAME"],
                      "created_utc": utc_now(),
                      "task_set": TASKS,
                      "distilled_adapter_path": DISTILLED_ADAPTER_PATH,
                      "adapter_source_job": "distill-stage1-5-from-qwen3-emb",
                      "models": MODELS,
                      "max_length": MAX_LENGTH,
                      "batch_size": BATCH_SIZE,
                      "dtype": "bfloat16",
                      "anchors": {
                          "stage1_5_v1_act_ret_mean_raw_docs_avg_ndcg10": 0.3536,
                          "qwen3_emb_0_6b_qwen_instruction_last_token_avg_ndcg10": 0.4427,
                      },
                      "versions": {
                          "python": os.sys.version,
                          "torch": torch.__version__,
                          "transformers": transformers.__version__,
                          "peft": peft.__version__,
                          "mteb": getattr(mteb, "__version__", "unknown"),
                          "numpy": np.__version__,
                      },
                      "pins": {
                          "torch": "installed from https://download.pytorch.org/whl/cu121",
                          "transformers": "4.51.3",
                          "accelerate": "pip latest at job runtime",
                          "peft": "pip latest at job runtime",
                          "mteb": "pip latest at job runtime",
                          "numpy": "pip latest at job runtime",
                      },
                      "act_ret_source": {
                          "ref": os.environ.get("ACT_RET_SOURCE_REF"),
                          "sha": os.environ.get("ACT_RET_SOURCE_SHA"),
                      },
                  }

              def save_progress(config, results, summary=None):
                  payload = {"config": config, "results": results}
                  if summary is not None:
                      payload["summary"] = summary
                  tmp_path = OUTPUT_PATH + ".tmp"
                  with open(tmp_path, "w") as f:
                      json.dump(payload, f, indent=2, sort_keys=True)
                  os.replace(tmp_path, OUTPUT_PATH)

              def summarize(results):
                  summary = {}
                  for model_key, task_results in results.items():
                      ndcgs = [metrics["ndcg10"] for metrics in task_results.values()]
                      summary[model_key] = {
                          "avg_ndcg10": float(np.mean(ndcgs)) if ndcgs else None,
                          "tasks": sorted(task_results.keys()),
                      }
                      prior = MODELS[model_key].get("prior_avg_ndcg10")
                      if prior is not None and summary[model_key]["avg_ndcg10"] is not None:
                          summary[model_key]["delta_vs_prior_avg_ndcg10"] = summary[model_key]["avg_ndcg10"] - prior
                  if (
                      "distilled_stage1_5_qwen3" in summary
                      and "stage1_5_v1_anchor" in summary
                      and summary["distilled_stage1_5_qwen3"]["avg_ndcg10"] is not None
                      and summary["stage1_5_v1_anchor"]["avg_ndcg10"] is not None
                  ):
                      summary["distilled_stage1_5_qwen3"]["delta_vs_stage1_5_v1_current_run"] = (
                          summary["distilled_stage1_5_qwen3"]["avg_ndcg10"]
                          - summary["stage1_5_v1_anchor"]["avg_ndcg10"]
                      )
                  if (
                      "distilled_stage1_5_qwen3" in summary
                      and "qwen3_emb_0_6b_teacher_anchor" in summary
                      and summary["distilled_stage1_5_qwen3"]["avg_ndcg10"] is not None
                      and summary["qwen3_emb_0_6b_teacher_anchor"]["avg_ndcg10"] is not None
                  ):
                      summary["distilled_stage1_5_qwen3"]["delta_vs_qwen3_teacher_current_run"] = (
                          summary["distilled_stage1_5_qwen3"]["avg_ndcg10"]
                          - summary["qwen3_emb_0_6b_teacher_anchor"]["avg_ndcg10"]
                      )
                  return summary

              def main():
                  os.makedirs(RESULTS_DIR, exist_ok=True)
                  config = package_config()
                  results = {}
                  task_data = {task_name: load_retrieval_task(task_name) for task_name in TASKS}
                  save_progress(config, results)

                  for model_key, model_config in MODELS.items():
                      tokenizer, model = load_model(model_key, model_config)
                      results[model_key] = {}
                      pooling = model_config["pooling"]
                      query_prefix = model_config["query_prefix"]

                      for task_name in TASKS:
                          data = task_data[task_name]
                          print(f"\nEvaluating {model_key} on {task_name}", flush=True)
                          corpus_embeddings = encode(model, tokenizer, data["corpus_texts"], "", pooling)
                          query_embeddings = encode(model, tokenizer, data["query_texts"], query_prefix, pooling)
                          metrics = compute_metrics(
                              query_embeddings,
                              corpus_embeddings,
                              data["query_ids"],
                              data["corpus_ids"],
                              data["qrels"],
                          )
                          results[model_key][task_name] = metrics
                          print(
                              f"  {model_key} {task_name}: "
                              f"ndcg10={metrics['ndcg10']:.4f} "
                              f"hits1={metrics['hits1']:.4f} "
                              f"mrr={metrics['mrr']:.4f}",
                              flush=True,
                          )
                          save_progress(config, results, summarize(results))

                          del corpus_embeddings
                          del query_embeddings
                          gc.collect()
                          torch.cuda.empty_cache()

                      del model
                      del tokenizer
                      gc.collect()
                      torch.cuda.empty_cache()

                  config["finished_utc"] = utc_now()
                  save_progress(config, results, summarize(results))
                  print(f"\nWrote {OUTPUT_PATH}", flush=True)
                  print(json.dumps(summarize(results), indent=2, sort_keys=True), flush=True)

              if __name__ == "__main__":
                  main()
              PYTHON_SCRIPT

              python run_distilled_eval.py
              date -u +"finish_utc=%Y-%m-%dT%H:%M:%SZ"
          env:
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            requests:
              memory: 32Gi
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: 38Gi
              cpu: 4800m
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /workspace/results
              subPathExpr: "$(JOB_NAME)"
            - name: data
              mountPath: /workspace/distilled-adapter
              subPath: distill-stage1-5-from-qwen3-emb/final
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unified-model-data-vol
