# Nautilus Kubernetes Job for Unified Agentic Model Training
# ============================================================
# OPTIMIZED FOR 4x L40S-48GB GPUs (Full Training Run with FIXED loop)
#
# Follows Nautilus cluster policies exactly:
# - Uses kind: Job (NOT pod or deployment)
# - Script runs to completion (NO sleep infinity)
# - Resource limits within 20% of requests
# - Uses initContainer for git clone (reproducibility)
# - Mounts proper PVCs for data persistence
#
# SUBMIT:
#    kubectl apply -f unified-training-job.yaml -n svcl-self-improve
#
# MONITOR:
#    kubectl get jobs
#    kubectl logs -f <pod-name>
#    kubectl describe job unified-agentic-training
#
# DELETE WHEN DONE:
#    kubectl delete job unified-agentic-training

apiVersion: batch/v1
kind: Job
metadata:
  name: unified-agentic-training
  namespace: svcl-self-improve
spec:
  backoffLimit: 3  # Retry 3 times on failure
  template:
    spec:
      restartPolicy: Never

      # === INIT CONTAINER: Git clone the repo ===
      initContainers:
        - name: init-clone-repo
          image: alpine/git
          args:
            - clone
            - --single-branch
            - --branch
            - main
            - https://github.com/arjunvad123/unified-model-open-instruct.git
            - /opt/repo/unified-model-open-instruct
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"   # ~17% above request (within 20% Nautilus rule)
              cpu: "120m"       # 20% above request
          volumeMounts:
            - name: git-repo-code
              mountPath: /opt/repo

      # === MAIN CONTAINER: Training ===
      containers:
        - name: unified-training
          image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

          # Command runs training script to completion (NO sleep infinity)
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              echo "=========================================="
              echo "Unified Agentic Model Training on Nautilus"
              echo "4x L40S-48GB GPU Configuration (Distributed Training)"
              echo "=========================================="
              echo "Start time: $(date)"
              echo "GPU Info:"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              echo "Number of GPUs: $(nvidia-smi -L | wc -l)"

              # === INSTALL UV (fast Python package manager) ===
              echo "Installing uv..."
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"

              # === NAVIGATE TO CODE ===
              cd /code/unified-model-open-instruct

              # === MODIFY PYPROJECT.TOML ===
              # Remove flash-attn and liger-kernel to avoid long compilation
              # (We'll use PyTorch's native SDPA attention instead)
              echo "Removing flash-attn from dependencies..."
              sed -i '/flash-attn/d' pyproject.toml
              sed -i '/liger-kernel/d' pyproject.toml

              # === INSTALL DEPENDENCIES WITH UV ===
              echo "Installing dependencies with uv (this handles Python 3.12)..."
              uv sync --frozen 2>/dev/null || uv sync

              # === VERIFY SETUP ===
              echo "Python version:"
              uv run python --version
              echo "PyTorch version:"
              uv run python -c "import torch; print(f'PyTorch {torch.__version__}, CUDA available: {torch.cuda.is_available()}, GPU count: {torch.cuda.device_count()}')"

              # === RUN DISTRIBUTED TRAINING ===
              # Per Technical Report:
              # - Model: Qwen2.5-7B with QLoRA (r=64, alpha=128)
              # - Combined loss: L_lm + 0.5 × L_contrastive
              # - Data: 40% embedding, 35% generation, 25% agentic
              # - Temperature: 0.07
              #
              # With 4x L40S-48GB GPUs:
              # - Batch size 4 per device (16 total)
              # - Gradient accumulation 4 for effective batch 64
              # - Embedding batch 32 per GPU, gathered across GPUs = 128 total
              echo "=========================================="
              echo "Starting distributed training on 4x L40S-48GB GPUs..."
              echo "=========================================="

              # Multi-GPU training with accelerate (4x L40S-48GB)
              uv run accelerate launch \
                  --num_processes 4 \
                  --mixed_precision no \
                  -m open_instruct.unified_finetune \
                  --exp_name unified_agentic_7b_4xV100 \
                  --model_name_or_path Qwen/Qwen2.5-7B \
                  --use_flash_attn false \
                  --use_qlora true \
                  --use_lora true \
                  --lora_rank 64 \
                  --lora_alpha 128 \
                  --lora_dropout 0.05 \
                  --max_seq_length 1024 \
                  --embedding_max_length 256 \
                  --per_device_train_batch_size 2 \
                  --gradient_accumulation_steps 8 \
                  --learning_rate 2e-4 \
                  --lr_scheduler_type cosine \
                  --warmup_ratio 0.03 \
                  --weight_decay 0.01 \
                  --num_train_epochs 3 \
                  --max_embedding_samples 50000 \
                  --max_generation_samples 50000 \
                  --max_agentic_samples 25000 \
                  --embedding_sources msmarco \
                  --generation_sources tulu3 \
                  --embedding_batch_ratio 0.4 \
                  --generation_batch_ratio 0.35 \
                  --agentic_batch_ratio 0.25 \
                  --embedding_batch_size 16 \
                  --gather_embeddings_across_gpus true \
                  --contrastive_weight 0.5 \
                  --temperature 0.07 \
                  --output_dir /data/unified_model_output_4xV100/ \
                  --logging_steps 10 \
                  --checkpointing_steps 500 \
                  --keep_last_n_checkpoints 3 \
                  --gradient_checkpointing true \
                  --with_tracking false \
                  --seed 42

              echo "=========================================="
              echo "Training COMPLETE!"
              echo "End time: $(date)"
              echo "Output saved to: /data/unified_model_output_4xA100/"
              echo "=========================================="

          # === RESOURCE REQUESTS/LIMITS ===
          # CRITICAL: Limits must be within 20% of requests (Nautilus policy)
          # 4x L40S-48GB GPUs for distributed training
          resources:
            requests:
              memory: "64Gi"
              cpu: "16"
              nvidia.com/gpu: "4"
            limits:
              memory: "76Gi"    # ~19% above request
              cpu: "19"         # ~19% above request
              nvidia.com/gpu: "4"

          # === VOLUME MOUNTS ===
          volumeMounts:
            - name: git-repo-code
              mountPath: /code
            - name: conda-storage
              mountPath: /root  # uv cache goes here
            - name: data-storage
              mountPath: /data  # Checkpoints and outputs go here
            - name: shm
              mountPath: /dev/shm  # Shared memory for multi-GPU NCCL

          # === ENVIRONMENT VARIABLES ===
          env:
            - name: HF_HOME
              value: "/data/huggingface_cache"
            - name: TRANSFORMERS_CACHE
              value: "/data/huggingface_cache"
            - name: UV_CACHE_DIR
              value: "/root/.cache/uv"
            - name: WANDB_MODE
              value: "disabled"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: NCCL_DEBUG
              value: "WARN"

      # === VOLUMES ===
      volumes:
        - name: git-repo-code
          emptyDir: {}  # Temporary volume, cloned fresh each run
        - name: conda-storage
          emptyDir: {}  # Use emptyDir for flexibility
        - name: data-storage
          emptyDir: {}  # Use emptyDir to avoid PVC region constraints
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "32Gi"  # Larger shared memory for A100 NCCL

      # === GPU AFFINITY: V100-32GB GPUs ===
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - Tesla-V100-SXM2-32GB

      # Tolerate GPU nodes
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
