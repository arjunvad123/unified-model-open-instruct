# Joint Training: Stage 2 (GritLM-style bidirectional embedding + generation)
#
# *** STATUS: EXPERIMENTAL / UNVALIDATED ***
# Last activity Apr 6 2026 (4D attention-mask fix). No checked-in evidence
# the run trained to completion afterwards. Treat the design as work-in-
# progress, not a landed result. Re-launching may surface additional
# downstream errors from the Apr 4–6 debugging chain. Confirm with Arjun
# before allocating compute.
#
# Key innovations over Stage 1.5 (sequential contrastive):
#   1. Bidirectional attention for embedding (is_causal=False) — +5.5 MTEB per GritLM
#   2. Joint training (alternating emb/gen/agentic batches) — zero forgetting
#   3. Equal loss weighting (contrastive_weight=1.0) — per GritLM
#   4. Temperature 0.02 — sharper contrastive signal
#
# Base model: Stage 1 (action token SFT on Qwen2.5-3B-Instruct)
# Data: MEDI2 500K (embedding) + Tulu3/RAGBench/HotpotQA (generation) + synthetic agentic
# Expected: ~8-12 hours on single A100
#
# Deploy: kubectl apply -f joint-training-stage2-v1.yaml -n svcl-self-improve
# Logs:   kubectl logs job/joint-train-stage2-v1 -n svcl-self-improve -f

apiVersion: batch/v1
kind: Job
metadata:
  name: joint-train-stage2-v2
  namespace: svcl-self-improve
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400  # 24 hours max
  template:
    spec:
      restartPolicy: Never

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-L40S
                - NVIDIA-L40
                - NVIDIA-RTX-A6000
                - NVIDIA-A40
                - NVIDIA-GeForce-RTX-4090

      containers:
        - name: train
          image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              echo "============================================================"
              echo "JOINT TRAINING: Stage 2 (Bidirectional Embedding + Gen)"
              echo "============================================================"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv
              echo ""

              # ---- System deps ----
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends \
                curl ca-certificates python3 python3-pip python3-venv git

              # ---- Python env ----
              python3 -m venv /opt/venv
              export PATH="/opt/venv/bin:$PATH"

              # Pin transformers to the 4.x line. The 5.x release refactored
              # the attention-mask infrastructure (`masking_utils.and_mask`)
              # and breaks our 4D bidirectional embedding mask in
              # `make_bidirectional_attention_mask`. The April 4D-mask fix
              # was written against transformers 4.51.x; under 5.x the same
              # mask shape produces RuntimeError "size of tensor a (2) must
              # match the size of tensor b (512) at non-singleton dimension
              # 3" on the very first forward pass. Pinning < 5.0 restores
              # the working state. If we want to support transformers 5.x
              # long-term, `make_bidirectional_attention_mask` needs to be
              # updated to the new mask interface -- that's a separate
              # refactor, not blocking this run.
              pip install --no-cache-dir \
                torch \
                "transformers>=4.51.0,<5.0" \
                accelerate \
                peft \
                datasets \
                huggingface_hub \
                tqdm \
                numpy \
                bitsandbytes \
                rich \
                protobuf \
                sentencepiece

              # ---- Clone repo ----
              # Use main, not benchmarking-suite. PR #2's bug fixes
              # (hard-negative gather padding, query prefix wiring, MEDI2
              # negatives in contrastive candidate set) all merged to main
              # on 2026-05-10. benchmarking-suite is Arjun's older branch
              # without those fixes -- launching off it would silently
              # repeat the April-stall bug profile.
              echo "Cloning repository..."
              git clone https://github.com/arjunvad123/unified-model-open-instruct.git /workspace/repo
              cd /workspace/repo
              git checkout main
              echo "Checked out main branch"

              # ---- Login to HuggingFace ----
              python3 -c "from huggingface_hub import login; login(token='${HF_TOKEN}')"

              # ---- Set Python path for open_instruct imports ----
              export PYTHONPATH="/workspace/repo:$PYTHONPATH"

              # ---- Run joint training ----
              echo ""
              echo "============================================================"
              echo "Starting joint training..."
              echo "  Base: Arjunvad/unified-model-stage1-action-tokens-v2"
              echo "  Bidirectional embedding: True"
              echo "  Contrastive weight: 1.0"
              echo "  Temperature: 0.02"
              echo "  LoRA rank: 32, alpha: 64"
              echo "  LR: 2e-5, epochs: 1"
              echo "  Data: MEDI2 (500K) + Tulu3 + RAGBench + HotpotQA"
              echo "============================================================"
              echo ""

              python3 open_instruct/unified_finetune.py \
                --model_name_or_path Arjunvad/unified-model-stage1-action-tokens-v2 \
                --use_lora true \
                --use_qlora false \
                --lora_rank 32 \
                --lora_alpha 64 \
                --use_bidirectional_embedding true \
                --use_flash_attn false \
                --temperature 0.02 \
                --contrastive_weight 1.0 \
                --learning_rate 2e-5 \
                --num_train_epochs 1 \
                --per_device_train_batch_size 4 \
                --gradient_accumulation_steps 8 \
                --max_embedding_samples 100000 \
                --max_generation_samples 50000 \
                --max_agentic_samples 10000 \
                --embedding_sources medi2 \
                --generation_sources tulu3 \
                --embedding_max_length 512 \
                --max_seq_length 1024 \
                --warmup_ratio 0.03 \
                --gradient_checkpointing true \
                --logging_steps 10 \
                --checkpointing_steps 2000 \
                --output_dir /workspace/output/stage2-joint-v1 \
                --push_to_hub true \
                --hub_model_id Arjunvad/unified-model-stage2-joint-v1 \
              2>&1 || { echo "TRAINING FAILED"; cat /workspace/output/stage2-joint-v1/*.log 2>/dev/null; exit 1; }

              echo ""
              echo "============================================================"
              echo "TRAINING COMPLETE"
              echo "Model pushed to: Arjunvad/unified-model-stage2-joint-v1"
              echo "============================================================"

          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: TRANSFORMERS_CACHE
              value: /workspace/cache
            - name: HF_HOME
              value: /workspace/cache

          resources:
            requests:
              cpu: "4"
              memory: "32Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "48Gi"
              nvidia.com/gpu: "1"
