apiVersion: batch/v1
kind: Job
metadata:
  name: distill-stage1-5-qwen3-gen-replay-anchors
  namespace: svcl-self-improve
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A100-SXM4-80GB
                      - NVIDIA-A100-80GB-PCIe
                      - NVIDIA-A100-PCIE-40GB
                      - NVIDIA-A100-SXM4-40GB
                      - NVIDIA-L40S
                      - NVIDIA-L40
                      - NVIDIA-A40
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-6000-Ada-Generation
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: PreferNoSchedule
      containers:
        - name: distill
          image: nvidia/cuda:12.4.1-cudnn-devel-ubuntu22.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              echo "==========================================================="
              echo "Pilot: Qwen3 retrieval distillation + repeated gate-anchor replay KL"
              echo "==========================================================="
              echo "Goal: train one active LoRA adapter that improves retrieval"
              echo "while preserving Stage 1.5 generation logits on assistant"
              echo "tokens. Replay now heavily repeats exact_hello/json_yes"
              echo "anchors to test whether the KL objective can fix them."
              date -u +"start_utc=%Y-%m-%dT%H:%M:%SZ"
              nvidia-smi --query-gpu=index,name,memory.total --format=csv

              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends \
                curl ca-certificates python3 python3-pip python3-venv git

              python3 -m venv /opt/venv
              export PATH="/opt/venv/bin:$PATH"

              pip install --no-cache-dir \
                torch \
                "transformers==4.51.3" \
                accelerate \
                peft \
                datasets \
                huggingface_hub \
                tqdm \
                numpy \
                rich \
                protobuf \
                sentencepiece

              mkdir -p /workspace/results
              cd /workspace

              DISTILL_REPO_REF="${DISTILL_REPO_REF:-main}"
              echo "Checking out ref=$DISTILL_REPO_REF"
              if ! git clone --depth 1 --branch "$DISTILL_REPO_REF" \
                https://github.com/arjunvad123/unified-model-open-instruct.git /workspace/repo; then
                echo "  --branch failed (likely a SHA, not a branch/tag); using full clone + checkout"
                git clone https://github.com/arjunvad123/unified-model-open-instruct.git /workspace/repo
                ( cd /workspace/repo && git checkout "$DISTILL_REPO_REF" )
              fi
              cd /workspace/repo
              export DISTILL_SOURCE_REF="$DISTILL_REPO_REF"
              export DISTILL_SOURCE_COMMIT="$(git rev-parse HEAD)"
              echo "Checked out $DISTILL_SOURCE_REF (head=$(git rev-parse --short HEAD))"
              export PYTHONPATH=/workspace/repo:${PYTHONPATH:-}

              python3 open_instruct/distill_finetune.py \
                --student_model Arjunvad/unified-model-stage1-5 \
                --teacher_model Qwen/Qwen3-Embedding-0.6B \
                --output_dir /workspace/results \
                --num_train_examples 12000 \
                --max_length 256 \
                --per_device_batch_size 4 \
                --gradient_accumulation_steps 4 \
                --num_train_epochs 1 \
                --max_train_steps 250 \
                --learning_rate 5e-5 \
                --lr_scheduler_type cosine \
                --warmup_ratio 0.03 \
                --weight_decay 0.01 \
                --distill_temperature 0.05 \
                --distill_weight 1.0 \
                --info_nce_weight 0.1 \
                --generation_replay_weight 4.0 \
                --generation_replay_temperature 1.0 \
                --generation_replay_num_examples 4000 \
                --generation_replay_sources exact_format,dolly15k,alpaca,code_alpaca,tulu3,ragbench,hotpotqa \
                --generation_replay_max_length 512 \
                --generation_replay_batch_size 1 \
                --generation_replay_balance_categories true \
                --generation_replay_scan_multiplier 8 \
                --generation_replay_required_categories exact,format,extraction,summary,rewrite,code,classification,math,qa,general \
                --generation_replay_min_category_examples 50 \
                --lora_rank 32 \
                --lora_alpha 64 \
                --lora_dropout 0.05 \
                --lora_target_modules q_proj,k_proj,v_proj,o_proj \
                --seed 42 \
                --log_every 10 \
                --save_every 125

              date -u +"finish_utc=%Y-%m-%dT%H:%M:%SZ"
              echo "Pilot complete. Final adapter at /workspace/results/final"
              ls -lh /workspace/results/

              python3 - <<'PYTHON_SUMMARY'
              import json
              import os

              log_path = "/workspace/results/training_log.json"
              if not os.path.exists(log_path):
                  raise SystemExit(0)
              log = json.load(open(log_path))
              losses = log.get("losses", {})
              summary = {}
              for key, values in losses.items():
                  if values:
                      summary[f"first_{key}"] = values[0]
                      summary[f"last_{key}"] = values[-1]
                      summary[f"min_{key}"] = min(values)
              summary["num_steps"] = len(losses.get("total", []))
              summary["elapsed_s"] = log.get("elapsed_s")
              json.dump(
                  {"summary": summary, "args": log.get("args")},
                  open("/workspace/results/distill_generation_replay_summary.json", "w"),
                  indent=2,
              )
              print("Wrote distill_generation_replay_summary.json")
              PYTHON_SUMMARY
          env:
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          resources:
            requests:
              memory: 48Gi
              cpu: "6"
              nvidia.com/gpu: "1"
            limits:
              memory: 56Gi
              cpu: 7200m
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: results
              mountPath: /workspace/results
              subPathExpr: "$(JOB_NAME)"
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: unified-model-data-vol
